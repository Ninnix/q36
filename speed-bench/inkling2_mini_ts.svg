<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
<desc>Inkling-2-Mini-UD-IQ3_XXS on single-board Vulkan with Q8_0 K, Q4_0 V and 512-token prefill chunks. The input uses three copies of the Quarkstar story fixture. Each point measures 2048 new prompt tokens and 128 greedy decode tokens. Prefill and plain decode use the original measurements published in b06af7d. DSpark MTP decode was measured on 2026-11-27 with 55d3856, an eight-token draft limit, adaptive draft confidence and prompt lookup enabled. The MTP benchmark restored prompt checkpoints between timed points. An 8192-token warm-up preceded each run.</desc>
